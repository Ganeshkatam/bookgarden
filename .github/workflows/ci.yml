name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://bookgarden.tomesphere.in

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Validation
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Architecture Enforcement (Dependency Cruiser)
        run: npm run lint:arch

      - name: Unit Tests
        run: npm run test

      - name: Build
        run: npm run build
